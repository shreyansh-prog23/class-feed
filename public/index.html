<script>
// <parser>
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parseChat(raw) {
  const text = raw.replace(/[\u200e\u200f\u202a-\u202c\ufeff]/g, '').replace(/\u202f/g, ' ');
  const lines = text.split(/\r?\n/);
  const reA = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:\s?([AaPp])\.?[Mm]\.?)?\s+-\s+(.*)$/;
  const reB = /^\[(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::\d{2})?(?:\s?([AaPp])\.?[Mm]\.?)?\]\s+(.*)$/;
  const entries = [];
  let cur = null;
  for (const line of lines) {
    const m = reA.exec(line) || reB.exec(line);
    if (m) {
      cur = { a: +m[1], b: +m[2], y: +m[3], h: +m[4], mi: +m[5], ap: m[6] ? m[6].toLowerCase() : '', rest: m[7] };
      entries.push(cur);
    } else if (cur) {
      cur.rest += '\n' + line;
    }
  }
  let dmy = true;
  if (entries.some(e => e.a > 12)) dmy = true;
  else if (entries.some(e => e.b > 12)) dmy = false;
  const msgs = [];
  entries.forEach((e, i) => {
    const day = dmy ? e.a : e.b;
    const mon = dmy ? e.b : e.a;
    const year = e.y < 100 ? 2000 + e.y : e.y;
    let h = e.h;
    if (e.ap === 'p' && h < 12) h += 12;
    if (e.ap === 'a' && h === 12) h = 0;
    const ts = new Date(year, mon - 1, day, h, e.mi, 0, 0);
    const nl = e.rest.indexOf('\n');
    const head = nl < 0 ? e.rest : e.rest.slice(0, nl);
    const ix = head.indexOf(': ');
    let sender = null, body = e.rest.trim();
    if (ix > 0 && ix <= 80) {
      sender = head.slice(0, ix).replace(/^~[\s\u00a0]*/, '').trim();
      body = e.rest.slice(ix + 2).trim();
    }
    let kind = 'text', file = null;
    const first = body.split('\n')[0].trim();
    const fm = /^(.+?) \(file attached\)$/.exec(first) || /^<attached: (.+)>$/.exec(first);
    if (!sender) kind = 'system';
    else if (/^(This message was deleted|You deleted this message)\.?$/i.test(body)) kind = 'deleted';
    else if (fm) {
      kind = 'file'; file = { name: fm[1].trim() };
      body = body.split('\n').slice(1).map(x => x.trim()).filter(x => x && x !== file.name).join('\n');
      if (isNoiseFile(file.name)) kind = 'noise';
    }
    else if (/^(<Media omitted>|(image|video|audio|sticker|GIF|document|contact card) omitted)$/i.test(body)) kind = /^(sticker|GIF|audio|video) omitted$/i.test(body) ? 'noise' : 'media';
    const m = { i, ts, ms: ts.getTime(), sender, text: body, kind, file };
    m.fp = fingerprint(m);
    msgs.push(m);
  });
  return { msgs, dmy };
}

// Stickers, GIFs and voice notes can't carry a deadline, so they are dropped early.
function isNoiseFile(n) { return /^(STK|GIF|PTT|AUD|VID)-/i.test(n) || /sticker/i.test(n) || /\.(webp|gif|mp4|mov|mkv|avi|webm|3gp|m4v|opus|ogg|oga|m4a|mp3|aac|amr|wav)$/i.test(n); }
// Emoji-only messages and one-word replies are not worth sending anywhere.
function isJunkText(t) {
  const x = String(t || '').trim();
  if (!x) return true;
  if (!x.replace(/[^\p{L}\p{N}]+/gu, '')) return true;
  return /^(ok(ay)?|thanks?|thanx|thank\s*(you|u)|thankyou|yes|no|sir|ji|haan|done|noted|hi+|hello|hey|gm|good\s*(morning|evening|night|afternoon)|lol|haha+|hmm+|k)(\s+(sir|mam|ma'am|madam|you|so much|a lot|bhai|everyone|all|guys))*[\s.!]*$/i.test(x);
}

function fingerprint(m) {
  let h = 5381;
  const s = m.ms + '|' + m.sender + '|' + m.text + '|' + (m.file ? m.file.name : '');
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;

}

// ---------- subject routing ----------
function codesIn(text) {
  const out = [], re = /\b([A-Za-z]{2,5})[\s-]?(\d{3})\b/g;
  let m;
  while ((m = re.exec(String(text || '')))) out.push((m[1] + ' ' + m[2]).toUpperCase());
  return out;
}
function subjectRegistry() {
  const reg = { codes: {}, names: {} };
  Object.entries((S.aliases && S.aliases.codes) || {}).forEach(([k, v]) => { reg.codes[k] = v; });
  allSlots().forEach(x => {
    codesIn(x.code).forEach(c => { if (!reg.codes[c]) reg.codes[c] = x.subject; });
    if (x.subject) reg.names[norm(x.subject)] = x.subject;
  });
  Object.keys(S.groups).forEach(g => {
    const cs = codesIn(g); if (!cs.length) return;
    const cnt = {};
    S.cards.filter(c => c.group === g && c.subject && c.subject !== 'General').forEach(c => { cnt[c.subject] = (cnt[c.subject] || 0) + 1; });
    const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    if (best) cs.forEach(c => { if (!reg.codes[c]) reg.codes[c] = best[0]; });
  });
  S.cards.forEach(c => { if (c.subject && c.subject !== 'General') reg.names[norm(c.subject)] = c.subject; });
  return reg;
}
function groupSubject(group, reg) {
  for (const c of codesIn(group)) { if (reg.codes[c]) return reg.codes[c]; }
  const ng = ' ' + norm(group) + ' ';
  let best = null;
  Object.entries(reg.names).forEach(([k, v]) => { if (k.length > 2 && ng.includes(' ' + k + ' ') && (!best || k.length > best[0].length)) best = [k, v]; });
  if (best) return best[1];
  const cs = codesIn(group);
  return cs.length ? cs[0] : null;   // no better name yet: the course code itself
}
function routeSubject(card, reg) {
  const blob = [card.title, card.details].concat((card.sources || []).map(x => x.text)).concat((card.files || []).map(f => f.name)).join(' ');
  for (const c of codesIn(blob)) if (reg.codes[c]) return reg.codes[c];
  // "General", or a bare course code from an earlier guess, means the card has no real subject yet
  const unassigned = !card.subject || card.subject === 'General' || codesIn(card.subject).length > 0;
  if (!unassigned) return null;
  const nb = ' ' + norm(blob) + ' ';
  let best = null;
  Object.entries(reg.names).forEach(([k, v]) => { if (k.length > 2 && nb.includes(' ' + k + ' ') && (!best || k.length > best[0].length)) best = [k, v]; });
  if (best) return best[1];
  return groupSubject(card.group, reg);
}
function rerouteAll() {
  const reg = subjectRegistry();
  let n = 0;
  S.cards.forEach(c => { if (c.pinned) return; const s2 = routeSubject(c, reg); if (s2 && s2 !== c.subject) { c.subject = s2; n++; } });
  return n;
}

    if (gone.length && live.length) out.push(list(Array.from(new Set(gone.map(x => x.subject)))) + (gone.length === 1 ? ' is' : ' are') + ' cancelled today.');
  }

async function handleFile(f) {
  imp = { running: false, text: '', err: '', done: '' };
  try {
    const cutMs = pd(minStart()).getTime() - 7 * 864e5;
    let text, name, media = 0, zipFiles = {}, partial = false;
    if (/\.zip$/i.test(f.name)) {
      let files;
      if (f.size > BIG_ZIP) files = await openZipLazy(f);
      else {
        if (!window.JSZip) throw new Error('Opening zip files isn’t available here. Unzip it and choose the .txt inside.');
        const z = await JSZip.loadAsync(f);
        files = Object.values(z.files).filter(x => !x.dir);
      }
      const txt = files.find(x => /\.txt$/i.test(x.name) && /WhatsApp Chat|_chat/i.test(x.name)) || files.find(x => /\.txt$/i.test(x.name));
      if (!txt) throw new Error('No chat text file inside that zip.');
      const rt = await readTextSmart(await txt.async('blob'), cutMs);
      text = rt.text; partial = rt.partial;
      name = groupNameFromFile(/WhatsApp[ _]Chat/i.test(txt.name) ? txt.name : f.name);
      media = files.length - 1;
      files.forEach(x => { zipFiles[x.name.split('/').pop()] = x; });
    } else {
      const rt = await readTextSmart(f, cutMs);
      text = rt.text; partial = rt.partial;
      name = groupNameFromFile(f.name);
    }
    const r = parseChat(text);
    if (!r.msgs.length) throw new Error('That file doesn’t look like a WhatsApp export. Export the chat again and choose the file it makes.');
    const cut = cutMs;
    const total = r.msgs.length;
    r.msgs = r.msgs.filter(m => m.ms >= cut);
    const skippedOld = total - r.msgs.length;
    const counts = senderCounts(r.msgs);
    const g = S.groups[name];
    P = { name, msgs: r.msgs, mediaFiles: media, zipFiles, big: partial || f.size > BIG_ZIP, start: clampStart(g ? g.start : defaultStart()), skippedOld, selected: g && g.senders ? Object.assign(defaultSenders(counts), g.senders) : defaultSenders(counts) };
  } catch (e) {
    P = null; imp.err = e.message || 'Couldn’t open that file.';
  }
  render();
}

function chunkPrompt(group, chunk, before, existing, fixes, reg) {
  const line = (m, id) => {
    const t = m.kind === 'media' ? '(sent an attachment; the file is not included in this export)' : m.kind === 'file' ? '(sent a file named "' + m.file.name + '")' + (m.text ? ' with the caption: ' + m.text.replace(/\s*\n\s*/g, ' / ').slice(0, 300) : '') : m.text.replace(/\s*\n\s*/g, ' / ').slice(0, 700);
    const d = m.ts;
    return '[' + id + '] ' + WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()] + ' ' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' | ' + m.sender + ': ' + t;
  };
  const idMap = {};
  const lines = chunk.map((m, i) => { const id = 'm' + (i + 1); idMap[id] = m; return line(m, id); });
  const ctx = before.map((m, i) => line(m, 'c' + (i + 1)));
  const p = 'You read messages from a college class WhatsApp group and pick out what a student must remember.\n' +
    'Group: "' + group + '". Senders are shown by their saved contact names; a name like "Amit Prakash Sir Maths Sem 3" is a teacher for Maths.\n' +
    'Every message has an id, the date and weekday it was sent, the sender and the text.\n\n' +
    'Reply with ONLY a JSON array. Each element is one of:\n' +
    '{"op":"new","type":"assignment|exam|class_change|syllabus|material|notice","subject":"...","title":"...","due":"YYYY-MM-DD or null","time":"HH:MM or null","details":"...","src":["m1"],"attachment":true or false,"unsure":true or false,"note":"..."}\n' +
    '{"op":"update","card":"<id of an existing card>","due":"...","time":"...","title":"...","details":"...","src":["m3"],"why":"short reason"}  (include only the fields that change)\n\n' +
    'Rules:\n' +
    '1. Only extract what a student needs to remember or act on: assignments and deadlines, exams and quizzes, classes cancelled, moved or starting, syllabus, study material, important notices. Skip greetings, thanks, questions, jokes, joins and chatter. Ignore stickers, GIFs, voice notes, videos, audio, emoji-only messages and one-word replies.\n' +
    '2. Work out dates from the date of the message itself: "tomorrow", "today", "Monday" (the next Monday after the message). Never use today’s real date. If no day is given, due is null. If no time is stated, time is null. Never guess a time.\n' +
    '3. A message such as "submit above assignment by Monday" refers to the attachment sent just before it. The file’s content is not in this export, so create the card with attachment true, say in details that the file was not included, and set unsure true if the subject or title cannot be known.\n' +
    '4. "No class today" is type class_change with due set to the message’s date.\n' +
    '5. If a message changes an existing card (new date, extension, cancellation, a modified version of a file), return an update for that card instead of a new card.\n' +
    '6. subject: infer it from the sender name or text (for example Maths); otherwise "General". title: short and plain, under 60 characters. details: one short line, or "".\n' +
    '7. src lists the ids of the message(s) the card comes from, using only ids from the main list.\n' +
    '8. A message that sends a file gives you its name. Use it. A syllabus file is type syllabus. Lecture notes, slides, worksheets and similar files are type material, titled like the file name without the extension, tidied (no underscores). Do not invent a due date for them. A message such as "Modified version" right after a file, or the same file sent again under a slightly different name, means the earlier card should be updated (op update, with the new file message in src), not a new card.\n' +
    '9. If nothing qualifies, reply [].\n\n' +
    (reg && (Object.keys(reg.codes).length || Object.keys(reg.names).length) ? 'Known subjects: ' + JSON.stringify(Array.from(new Set(Object.values(reg.names)))) + '. Course codes: ' + JSON.stringify(reg.codes) + '. A group can mix courses, so decide each message’s subject from its own content (course code, subject name, file name, sender) and use the exact names above when one fits, even if the group is about something else. Use "General" only if nothing fits.\n\n' : '') +
    (codesIn(group).length ? 'This group is for the course ' + codesIn(group).join(' / ') + (reg && reg.codes[codesIn(group)[0]] && codesIn(reg.codes[codesIn(group)[0]]).length === 0 ? ', which is the subject ' + reg.codes[codesIn(group)[0]] : '') + '. If a message or the sender’s name shows the subject name, use that name; if nothing does, use the course code itself as the subject, not "General".\n\n' : '') +
    (fixes && fixes.length ? 'Corrections this student made earlier. Learn from them and do the same:\n' + JSON.stringify(fixes) + '\n\n' : '') +
    'Existing cards: ' + JSON.stringify(existing) + '\n\n' +
    (ctx.length ? 'Earlier messages, for context only (never use these ids in src):\n' + ctx.join('\n') + '\n\n' : '') +

}

function applyItems(groupName, items, idMap) {
  let added = 0, updated = 0;
  if (!Array.isArray(items)) items = items && Array.isArray(items.cards) ? items.cards : [];
  for (const it of items) {
    if (!it || typeof it !== 'object') continue;
    const srcMsgs = (Array.isArray(it.src) ? it.src : []).map(id => idMap[id]).filter(Boolean);
    const src = srcMsgs.map(m => ({ ms: m.ms, sender: m.sender, text: m.kind === 'media' ? '(attachment, not included in this export)' : m.kind === 'file' ? 'File: ' + m.file.name + (m.text ? ' (' + m.text.slice(0, 200) + ')' : '') : m.text.slice(0, 500) }));
    const fl = srcMsgs.filter(m => m.kind === 'file').map(m => ({ name: m.file.name, key: fileKey(groupName, m) }));
    const clean = {
      type: TYPES[it.type] ? it.type : undefined,
      subject: typeof it.subject === 'string' && it.subject.trim() ? it.subject.trim().slice(0, 30) : undefined,
      title: typeof it.title === 'string' && it.title.trim() ? it.title.trim().slice(0, 80) : undefined,
      due: isDate(it.due) ? it.due : (it.due === null ? null : undefined),
      time: isTime(it.time) ? it.time : (it.time === null ? null : undefined),
      details: typeof it.details === 'string' ? it.details.trim().slice(0, 200) : undefined
    };
    if (it.op === 'update') {
      const c = S.cards.find(x => x.id === it.card && x.group === groupName);
      if (c) {
        const bits = [];
        if (clean.due !== undefined && clean.due !== c.due) { if (c.due && clean.due) c.moved = c.due; bits.push('date: ' + (c.due ? fmtDate(c.due) : 'none') + ' to ' + (clean.due ? fmtDate(clean.due) : 'none')); c.due = clean.due; }
        if (clean.time !== undefined && clean.time !== c.time) { bits.push('time: ' + (c.time ? fmtTime(c.time) : 'none') + ' to ' + (clean.time ? fmtTime(clean.time) : 'none')); c.time = clean.time; }
        if (clean.title && clean.title !== c.title) { bits.push('title changed'); c.title = clean.title; }
        if (clean.details) c.details = clean.details;
        if (src.length) c.sources = (c.sources || []).concat(src).slice(-6);
        addFiles(c, fl);
        c.changedAt = Date.now();
        c.history = (c.history || []).concat([{ at: Date.now(), what: (bits.join(', ') || 'updated') + (typeof it.why === 'string' && it.why ? ' (' + it.why.slice(0, 80) + ')' : '') }]);
        updated++;
        continue;
      }
    }
    if (!clean.title) continue;
    const dup = S.cards.find(x => x.group === groupName && x.title.toLowerCase() === clean.title.toLowerCase() && (x.due || '') === (clean.due || ''));
    if (dup) { if (src.length) dup.sources = (dup.sources || []).concat(src).slice(-6); addFiles(dup, fl); continue; }
    S.cards.push({
      id: 'c' + Date.now().toString(36) + (S.seq++),

async function readFile(c, btn) {
  const f = (c.files || []).find(x => x.key === btn.dataset.read);
  if (!f) return;
  const say = t => { btn.textContent = t; };
  if (!sampleFn) return say('Reading needs Claude, which isn’t available here.');
  if (isImg(f.name)) return readPhoto(c, f, btn);
  btn.disabled = true; say('Reading…');
  try {
    const blob = await getFile(f.key);
    if (!blob) return say('File isn’t saved on this device.');
    await loadPdf();
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()) }).promise;
    const pages = Math.min(pdf.numPages, 30);
    let text = '';
    for (let n = 1; n <= pages && text.length < 40000; n++) {
      const pg = await pdf.getPage(n);
      const tc = await pg.getTextContent();
      text += '\n[page ' + n + '] ' + tc.items.map(i => i.str).join(' ');
    }
    if (text.replace(/\[page \d+\]/g, '').trim().length < 40) return readScanned(c, f, btn, blob);
    const prompt = 'You read a college course document for a student. File name: "' + f.name + '".\nText of the first ' + pages + ' pages:\n' + text.slice(0, 40000) +
      '\n\nReply with ONLY JSON: {"summary":"two or three plain sentences about what this document is","topics":["short topic names, up to 15"],"dates":[{"what":"what happens","date":"YYYY-MM-DD or null","text":"the date as written"}]}\nOnly include dates that are written in the text. If a date has no year, set date to null and keep the text. Do not invent anything.';
    const r = await sampleFn.json(prompt, { modelTier: 'default' });
    f.read = {
      summary: String((r && r.summary) || '').slice(0, 600) || 'No summary.',
      topics: (Array.isArray(r && r.topics) ? r.topics : []).map(x => String(x).slice(0, 80)).slice(0, 20),
      dates: (Array.isArray(r && r.dates) ? r.dates : []).filter(x => x && x.what).slice(0, 10).map(x => ({ what: String(x.what).slice(0, 100), date: isDate(x.date) ? x.date : null, text: String(x.text || '').slice(0, 60) })),
      pages, at: Date.now()
    };
    save(); openSheet(c.id);
  } catch (e) { btn.disabled = false; say(sampleError(e)); }
}

    (feedErr ? '<div class="err">' + esc(feedErr) + '</div>' : '') + '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="join">Join</button></div></div>';
}
function viewFeed() {
  document.body.dataset.mood = 'lilac';
  const ago = S.feedAt ? Date.now() - S.feedAt : 0;
  const last = !S.feedAt ? 'not yet' : ago < 60000 ? 'just now' : ago < 3600000 ? Math.round(ago / 60000) + ' min ago' : rel(new Date(S.feedAt).toISOString());
  let h = '<div class="top"><div class="pill">Class</div></div>';
  h += '<h1 class="hero" style="font-size:clamp(30px,9.5vw,40px);line-height:1.05">Your class.</h1>';
  h += peopleBlock();
  h += '<div class="panel"><h3>Updated ' + esc(last) + '</h3><p>' + S.cards.length + ' cards. They arrive by themselves.</p>' + (feedErr ? '<div class="err">' + esc(feedErr) + '</div>' : '') + '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="feedrefresh"' + (feedRefreshing ? ' disabled' : '') + '>' + (feedRefreshing ? 'Refreshing…' : 'Refresh now') + '</button></div></div>';
  if (!S.alertsOn) h += '<div class="panel"><h3>Alerts</h3><p>Get a notification before a deadline, and when a class is cancelled or a date moves.</p>' + (feedMsg ? '<p class="note">' + esc(feedMsg) + '</p>' : '') + '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="feedalerts">Turn on alerts</button></div></div>';
  return h;
}

const RESET_ID = 'r1';   // one-time reset asked for by the owner; remove this block in the next build
if (S.resetDone !== RESET_ID) {
  S.resetDone = RESET_ID;
  if (S.cards.length || Object.keys(S.groups).length) { startFresh(); tidyMsg = 'Cleared everything except your timetable, as you asked. Import your chats again from scratch.'; }
  else save();
}
if (!tidyMsg && !FEED) tidyNow(true);
render();
if (!S.tourDone) { if (S.cards.length || Object.keys(S.groups).length) { S.tourDone = true; save(); } else if (!FEED || feedCode()) openTour(); }
checkShared();
if (FEED) { syncFeed().then(render); setInterval(() => { if (!document.hidden) syncFeed(); }, 60000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkShared(); if (FEED) syncFeed(); } });
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
